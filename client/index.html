<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>UNO</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- TABLE -->
<div id="table">

  <!-- TOP BAR -->
  <div id="topbar">
    <button id="menu-btn">☰</button>
    <div id="logo">UNO</div>
    <div id="scores">
      <div class="score-badge you">YOU <span id="score-p">0</span></div>
      <div class="score-badge cpu">CPU <span id="score-c">0</span></div>
    </div>
  </div>

  <!-- CPU PLAYER -->
  <div id="cpu-area">
    <div id="cpu-avatar">
      <div class="avatar-ring cpu-ring">
        <div class="avatar-face">🤖</div>
      </div>
      <div class="player-name">Computer</div>
      <div class="card-count" id="cpu-count">7</div>
    </div>
    <div id="cpu-hand-wrap">
      <div id="cpu-hand"></div>
    </div>
  </div>

  <!-- CENTER PLAY ZONE -->
  <div id="center-zone">
    <!-- Draw pile -->
    <div class="pile-group" id="draw-group" onclick="onDraw()">
      <div id="draw-pile">
        <div class="card back shadow-card s1"><span class="back-txt">UNO</span></div>
        <div class="card back shadow-card s2"><span class="back-txt">UNO</span></div>
        <div class="card back shadow-card s3"><span class="back-txt">UNO</span></div>
      </div>
      <div class="pile-label">DRAW</div>
    </div>

    <!-- Center info -->
    <div id="center-info">
      <div id="active-color-wrap">
        <div id="active-color-dot" class="color-dot"></div>
        <span id="active-color-name"></span>
      </div>
      <div id="dir-indicator">↺</div>
      <div id="turn-indicator" class="turn-you">YOUR TURN</div>
      <div class="thinking-dots" id="thinking">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Discard pile -->
    <div class="pile-group">
      <div id="discard-pile"></div>
      <div class="pile-label">DISCARD</div>
    </div>
  </div>

  <!-- PLAYER AREA -->
  <div id="player-area">
    <div id="player-hand-wrap">
      <div id="player-hand"></div>
    </div>
    <div id="player-avatar">
      <div class="avatar-ring you-ring">
        <div class="avatar-face">😎</div>
      </div>
      <div class="player-name">You</div>
      <div class="card-count you-count" id="player-count">7</div>
    </div>
  </div>

  <!-- ACTION BAR -->
  <div id="action-bar">
    <button id="uno-btn" onclick="callUno()" disabled>🔥 UNO!</button>
  </div>

</div>

<!-- COLOR MODAL -->
<div id="color-modal">
  <div id="color-box">
    <div id="color-box-title">Choose Color</div>
    <div id="color-grid">
      <button class="clr-btn red"    onclick="chooseColor('red')"><span>🔴</span><span class="clr-name">Red</span></button>
      <button class="clr-btn blue"   onclick="chooseColor('blue')"><span>🔵</span><span class="clr-name">Blue</span></button>
      <button class="clr-btn green"  onclick="chooseColor('green')"><span>🟢</span><span class="clr-name">Green</span></button>
      <button class="clr-btn yellow" onclick="chooseColor('yellow')"><span>🟡</span><span class="clr-name">Yellow</span></button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- WIN OVERLAY -->
<div id="win-overlay">
  <div class="conf-wrap" id="conf-wrap"></div>
  <div id="win-panel">
    <div id="win-emoji">🎉</div>
    <div id="win-title">YOU WIN!</div>
    <div id="win-sub">Computer ran out of cards!</div>
    <div id="win-score-row">
      <div class="win-score-box">
        <div class="wsb-label">YOU</div>
        <div class="wsb-val" id="wp">0</div>
      </div>
      <div class="win-score-box">
        <div class="wsb-label">CPU</div>
        <div class="wsb-val" id="wc">0</div>
      </div>
    </div>
    <button id="play-again-btn" onclick="initGame()">Play Again</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
