<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>UNO</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── ANIMATED SKY BACKGROUND ── -->
    <div class="sky-bg">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
    </div>

    <!-- ── GAME TABLE ── -->
    <div id="table">
      <!-- TOP BAR -->
      <header id="topbar">
        <div id="logo">UNO</div>
        <div id="turn-pill" class="turn-you">YOUR TURN</div>
        <div id="scores">
          <div class="score-chip you">YOU <span id="score-p">0</span></div>
          <div class="score-chip cpu">CPU <span id="score-c">0</span></div>
        </div>
      </header>

      <!-- CPU ZONE -->
      <section id="cpu-zone">
        <div class="player-avatar cpu-av">
          <div class="av-bubble cpu-bubble">🤖</div>
          <div class="av-name">Computer</div>
          <div class="av-count" id="cpu-count">7</div>
        </div>
        <div id="cpu-hand-wrap">
          <div id="cpu-hand"></div>
        </div>
      </section>

      <!-- CENTER ARENA -->
      <section id="arena">
        <!-- Draw pile -->
        <div class="pile-col" id="draw-col" onclick="onDraw()">
          <div class="pile-lbl">DRAW</div>
          <div id="draw-pile">
            <div class="card back dp-s1"><span class="btxt">UNO</span></div>
            <div class="card back dp-s2"><span class="btxt">UNO</span></div>
            <div class="card back dp-s3"><span class="btxt">UNO</span></div>
          </div>
        </div>

        <!-- Info column -->
        <div id="arena-info">
          <div id="color-ring-wrap">
            <div id="color-gem" class="gem-red"></div>
            <div id="color-name">RED</div>
          </div>
          <div id="dir-wheel">↺</div>
          <div class="think-dots" id="think-dots">
            <span></span><span></span><span></span>
          </div>
        </div>

        <!-- Discard pile -->
        <div class="pile-col">
          <div class="pile-lbl">DISCARD</div>
          <div id="discard-pile"></div>
        </div>
      </section>

      <!-- PLAYER ZONE -->
      <section id="player-zone">
        <div class="player-avatar you-av">
          <div class="av-bubble you-bubble">😎</div>
          <div class="av-name">You</div>
          <div class="av-count you-cnt" id="player-count">7</div>
        </div>
        <div id="player-hand-wrap">
          <div id="player-hand"></div>
        </div>
      </section>

      <!-- ACTION BAR -->
      <footer id="action-bar">
        <button id="uno-btn" onclick="callUno()" disabled>🔥 UNO!</button>
      </footer>
    </div>
    <!-- /#table -->

    <!-- ── COLOR CHOOSER MODAL ── -->
    <div id="color-modal">
      <div id="color-box">
        <div id="cbox-title">Pick a Color</div>
        <div id="color-grid">
          <button class="cbtn cbtn-red" onclick="chooseColor('red')">
            🔴<span>RED</span>
          </button>
          <button class="cbtn cbtn-blue" onclick="chooseColor('blue')">
            🔵<span>BLUE</span>
          </button>
          <button class="cbtn cbtn-green" onclick="chooseColor('green')">
            🟢<span>GREEN</span>
          </button>
          <button class="cbtn cbtn-yellow" onclick="chooseColor('yellow')">
            🟡<span>YELLOW</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ── TOAST ── -->
    <div id="toast"></div>

    <!-- ── WIN OVERLAY ── -->
    <div id="win-overlay">
      <div id="confetti-wrap"></div>
      <div id="win-panel">
        <div id="win-emoji">🎉</div>
        <div id="win-title">YOU WIN!</div>
        <div id="win-sub">Computer ran out of cards!</div>
        <div id="win-scores">
          <div class="wscore">
            <div class="wlbl">YOU</div>
            <div class="wval" id="wp">0</div>
          </div>
          <div class="wscore">
            <div class="wlbl">CPU</div>
            <div class="wval" id="wc">0</div>
          </div>
        </div>
        <button id="play-again-btn" onclick="initGame()">▶ Play Again</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
